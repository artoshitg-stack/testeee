name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Распаковать проект
        run: unzip -q ./*.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle -p aerolounge-android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AeroLounge-apk
          path: aerolounge-android/app/build/outputs/apk/debug/app-debug.apk
